<style>
@page { margin: 32px 38px; }
body { font-family: DejaVu Sans, sans-serif; font-size: 10px; color: #1f2937; line-height: 1.5; }
h1 { font-size: 19px; color: #EA580C; margin: 0 0 2px; }
.sub { font-size: 9.5px; color: #6b7280; margin-bottom: 14px; }
h2 { font-size: 12px; color: #111827; margin: 16px 0 6px; border-bottom: 2px solid #EA580C; padding-bottom: 3px; }
h3 { font-size: 10.5px; color: #9a3412; margin: 11px 0 4px; }
p { margin: 0 0 7px; }
table { width: 100%; border-collapse: collapse; margin: 5px 0 9px; }
th { background: #FFF7ED; color: #9a3412; text-align: left; font-size: 8.5px; text-transform: uppercase; letter-spacing: .4px; padding: 4px 6px; border-bottom: 1px solid #fed7aa; }
td { padding: 3px 6px; border-bottom: 1px solid #f1f5f9; font-size: 9px; vertical-align: top; }
td.id { color: #EA580C; font-weight: bold; width: 38px; }
td.nm { width: 148px; }
td.fn { font-family: DejaVu Sans Mono, monospace; font-size: 8px; color: #374151; }
td.hex { width: 74px; background: #fffbeb; }
.box { background: #FFF7ED; border-left: 3px solid #EA580C; padding: 9px 12px; margin: 7px 0 11px; }
.box b { color: #9a3412; }
.warn { background: #fef2f2; border-left: 3px solid #dc2626; padding: 9px 12px; margin: 7px 0 11px; }
.warn b { color: #991b1b; }
.good { background: #f0fdf4; border-left: 3px solid #15803d; padding: 9px 12px; margin: 7px 0 11px; }
.good b { color: #15803d; }
ul { margin: 3px 0 9px; padding-left: 15px; }
li { margin-bottom: 3px; }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 2px; border: 1px solid rgba(0,0,0,.15); }
.foot { margin-top: 14px; font-size: 8.5px; color: #9ca3af; border-top: 1px solid #e5e7eb; padding-top: 6px; }
.k { font-family: DejaVu Sans Mono, monospace; font-size: 9px; background: #f3f4f6; padding: 1px 4px; border-radius: 3px; }
.diag { border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa; margin: 6px 0 10px; }
.diag td { border: none; padding: 12px 14px; vertical-align: middle; font-size: 9px; }
.sq { width: 104px; height: 104px; border: 2px dashed #9ca3af; background: #ffffff; }
.sq td { padding: 0; text-align: center; vertical-align: middle; }
.ci { width: 92px; height: 92px; border-radius: 46px; background: #FDBA74; }
.cap { font-size: 9px; color: #4b5563; line-height: 1.55; }
</style>
<style>
/* Coverage summary strip */
.stat { width: 100%; border-collapse: separate; border-spacing: 6px 0; margin: 8px 0 12px; }
.stat td { background: #FFF7ED; border: 1px solid #fed7aa; border-radius: 6px; padding: 10px 8px; text-align: center; width: 33%; }
.stat .n { font-size: 20px; font-weight: bold; color: #EA580C; display: block; line-height: 1.1; }
.stat .l { font-size: 9px; color: #9a3412; display: block; margin-top: 3px; }

/* Placement wireframe */
.wf { border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin: 8px 0 6px; background: #fafafa; }
.wf-cap { font-size: 9px; color: #6b7280; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .4px; font-weight: bold; }
.row { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 7px; padding: 9px 10px; margin-bottom: 7px; }
.dot { display: inline-block; width: 26px; height: 26px; border-radius: 13px; background: #FFF7ED; border: 2px solid #EA580C; color: #EA580C; font-size: 7px; font-weight: bold; text-align: center; line-height: 24px; }
.ttl { display: inline-block; background: #e5e7eb; height: 9px; width: 160px; border-radius: 3px; }
.ln { display: inline-block; background: #f1f5f9; height: 7px; width: 110px; border-radius: 3px; }
.tag { font-size: 8px; color: #EA580C; font-weight: bold; }
.notag { font-size: 8px; color: #dc2626; font-weight: bold; }
.noz { background: #fef2f2; border: 1px dashed #fca5a5; border-radius: 6px; padding: 7px 9px; }
td.pg { font-weight: bold; color: #9a3412; width: 112px; }
td.sz { width: 54px; color: #6b7280; }
</style>
